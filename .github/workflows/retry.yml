name: AnyRouter 签到重试
# 每日补签：检测当日的签到工作流是否有失败账号，若有则补签一次（单次尝试），若无则直接结束。
# 避免每日签到遇到代理/站点临时波动、短时间重试仍失败时，错过当日签到。
on:
  schedule:
    # 北京时间 16:00 = UTC 08:00（签到工作流为 UTC 01:00 = 北京时间 09:00）
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试模式（截图 artifact、详细日志）
        required: false
        default: false
        type: boolean

jobs:
  retry:
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: "latest"

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v5
      id: uv-cache
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      run: |
        uv sync --frozen -q
        echo "✅ 环境初始化完成"

    - name: 安装系统依赖
      run: |
        PKGS="xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf"
        sudo apt-get update -qq >/dev/null
        sudo apt-get install -y -qq ${PKGS} >/dev/null 2>&1 || {
          echo "系统依赖安装失败，重新执行以查看详细错误："
          sudo apt-get install -y ${PKGS} 2>&1 | tail -60
          exit 1
        }
        echo "✅ 系统字体安装完成"

    - name: 缓存 CloakBrowser 二进制
      uses: actions/cache@v5
      id: cloakbrowser-cache
      with:
        path: ~/.cloakbrowser
        key: ${{ runner.os }}-cloakbrowser-v1
        restore-keys: |
          ${{ runner.os }}-cloakbrowser-

    - name: 安装 CloakBrowser
      run: |
        uv run python -m cloakbrowser install >/tmp/cloakbrowser-install.log 2>&1 && echo "✅ CloakBrowser 安装完成" || {
          echo "CloakBrowser 安装失败："
          tail -40 /tmp/cloakbrowser-install.log
          exit 1
        }

    # 检测今日签到运行结果：下载其 checkin-result artifact，解析失败账号索引
    - name: 查找今日签到结果并解析失败账号
      id: result
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        REPO="${GITHUB_REPOSITORY}"
        TODAY="$(date -u +%F)"
        RUN_ID="$(gh api "repos/${REPO}/actions/workflows/checkin.yml/runs" \
          --jq '[.workflow_runs[] | select(.created_at | startswith("'"${TODAY}"'")) | select(.status == "completed")][0].id' 2>/dev/null || true)"
        if [ -z "${RUN_ID:-}" ] || [ "${RUN_ID}" = "null" ]; then
          echo "今日未找到已完成的签到运行，跳过重试"
          echo "NEEDS_RETRY=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        if ! gh run download "${RUN_ID}" -n checkin-result -D /tmp/checkin-result -R "${REPO}" >/dev/null 2>&1; then
          echo "未找到签到结果 artifact，跳过重试"
          echo "NEEDS_RETRY=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        python - <<'EOF'
        import json, os
        p = '/tmp/checkin-result/checkin_result.json'
        try:
            with open(p, encoding='utf-8') as f:
                data = json.load(f)
            failed = [int(x) for x in data.get('failed', []) if isinstance(x, (int, float))]
        except Exception as e:
            print(f'解析签到结果失败: {e}')
            failed = []
        print(f'失败账号索引: {failed}')
        print(f"NEEDS_RETRY={'true' if failed else 'false'}")
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"NEEDS_RETRY={'true' if failed else 'false'}\n")
            if failed:
                f.write(f"RETRY_INDEXES={json.dumps(failed)}\n")
        if not failed:
            print('今日签到无失败任务，无需重试')
        EOF

    - name: 恢复余额历史缓存
      if: steps.result.outputs.NEEDS_RETRY == 'true'
      uses: actions/cache@v5
      with:
        path: |
          balance_hash.txt
          balance_snapshot.json
        key: balance-hash-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          balance-hash-${{ github.ref_name }}-
          balance-hash-

    - name: 恢复浏览器 Profile 缓存
      if: steps.result.outputs.NEEDS_RETRY == 'true'
      uses: actions/cache@v5
      with:
        path: .browser_profiles
        key: browser-profiles-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          browser-profiles-${{ runner.os }}-

    - name: 判断是否需要代理
      if: steps.result.outputs.NEEDS_RETRY == 'true'
      id: needs-proxy
      env:
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
      run: |
        python - <<'EOF'
        import json, os
        accounts = json.loads(os.getenv('ANYROUTER_ACCOUNTS') or '[]')
        providers = json.loads(os.getenv('PROVIDERS') or '{}')
        # 内置默认 use_proxy=true 的提供商（PROVIDERS 可覆盖 use_proxy）
        default_use_proxy = {'agentrouter'}
        needs = False
        for acc in accounts:
            p = acc.get('provider', 'anyrouter')
            pconf = providers.get(p, {})
            if pconf.get('use_proxy', p in default_use_proxy):
                needs = True
                break
        value = 'true' if needs else 'false'
        print(f"NEEDS_PROXY={value}")
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"NEEDS_PROXY={value}\n")
        EOF

    - name: 配置代理
      if: steps.result.outputs.NEEDS_RETRY == 'true' && steps.needs-proxy.outputs.NEEDS_PROXY == 'true'
      env:
        PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        PROXY_TEST_URL: https://www.google.com/generate_204
        MIHOMO_VERSION: v1.19.27
        PROXY_REQUIRED: false
      run: bash scripts/setup_mihomo_proxy.sh

    - name: 补签失败账号
      if: steps.result.outputs.NEEDS_RETRY == 'true'
      env:
        DEBUG_MODE: ${{ env.DEBUG_MODE }}
        # 重试仅补签今日失败账号，单次尝试，不做节点多次重试
        CHECKIN_RETRY_INDEXES: ${{ steps.result.outputs.RETRY_INDEXES }}
        # 关闭 cloakbrowser 后台"更新可用"线程提示，避免打断签到流程日志
        CLOAKBROWSER_AUTO_UPDATE: false
        CHECKIN_HEADLESS: false
        CHECKIN_HUMANIZE: true
        CHECKIN_WAIT_TIMEOUT_MS: 120000
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
        NOTIFYX_KEY: ${{ secrets.NOTIFYX_KEY }}
        NOTIFYX_TEAM: ${{ secrets.NOTIFYX_TEAM }}
      run: |
        xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py

    - name: 上传重试结果与调试截图
      if: always() && steps.result.outputs.NEEDS_RETRY == 'true'
      env:
        HTTP_PROXY: ''
        HTTPS_PROXY: ''
      uses: actions/upload-artifact@v4
      with:
        name: checkin-retry-${{ github.run_id }}
        path: |
          checkin_result.json
          checkin_screenshots/
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 7

    - name: 停止代理
      if: always() && steps.result.outputs.NEEDS_RETRY == 'true' && steps.needs-proxy.outputs.NEEDS_PROXY == 'true'
      run: bash scripts/stop_mihomo_proxy.sh

    - name: 执行结果
      if: always()
      run: |
        NEEDS_RETRY="${{ steps.result.outputs.NEEDS_RETRY }}"
        if [ "${NEEDS_RETRY}" = "true" ]; then
          echo "补签完成"
        else
          echo "今日签到无失败任务，重试工作流直接结束"
        fi
        echo "时间: $(date)"